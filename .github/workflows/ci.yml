name: CI

# Run on pushes to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, type-check & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: english_agent_test
          POSTGRES_USER: english_agent
          POSTGRES_PASSWORD: english_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_agent -d english_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv (with built-in cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python from .python-version
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formatting (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://english_agent:english_agent@localhost:5432/english_agent_test
