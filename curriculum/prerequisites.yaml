# Prerequisite graph over the topics of every level (curriculum/<level>_topics.yaml).
# `topic: [prerequisites]` — a topic is open to a learner once all of its prerequisites are mastered.
# Links may point to a lower level, never to a higher one. Topics not listed have no prerequisites.
# Checked at load time (english_agent.topic_graph): every id exists, no cycles, no upward links.
# Versioned on its own: the topics' `version` keys the shared content, so editing links here
# must not touch it. Bump `version` whenever a link is added, removed or changed.
#
# Drafted by the model, reviewed by hand (2026-11-19).
