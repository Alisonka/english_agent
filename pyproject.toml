[project]
name = "english-agent"
version = "0.1.0"
description = "Daily A2 English grammar lessons via Telegram"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
