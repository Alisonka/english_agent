[project]
name = "english-agent"
version = "0.1.0"
description = "Daily A2 English grammar lessons via Telegram"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "trafilatura>=2.3.1",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "fsrs>=6.3.2",
    "aiogram>=3.22",
    "taskiq>=0.11",
    "taskiq-redis>=1.1",
    "redis>=5.2",
    "python-json-logger>=3.2",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    "pytest-asyncio>=1.1",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
# Async tests and fixtures share one session-wide event loop, so a session-scoped async engine
# is never bound to a loop that a previous test already closed.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear,
# SIM: flake8-simplify, C4: flake8-comprehensions.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# TaskIQ injects job dependencies through default arguments, like FastAPI's Depends.
extend-immutable-calls = ["taskiq.TaskiqDepends"]

[tool.ruff.format]
# Defaults are fine; declared explicitly so the config is self-documenting.
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["english_agent"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Ships without type information (no py.typed).
module = ["opentelemetry.instrumentation.sqlalchemy.*"]
ignore_missing_imports = true
