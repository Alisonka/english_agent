# Git hooks that run automatically before each commit.
# Install once with:        uv run pre-commit install
# Run manually on all files: uv run pre-commit run --all-files
# Bump hook versions with:   uv run pre-commit autoupdate

repos:
  # Ruff: lint (with autofix) and format. Mirrors the CI checks.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Keep uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      - id: uv-lock

  # Secret scanning (catches the Telegram bot token, API keys, etc.).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Basic file hygiene and Python sanity checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements      # forgotten breakpoint() / pdb.set_trace()
      - id: check-ast             # file parses as valid Python
      - id: check-case-conflict   # File.py vs file.py (macOS <-> Linux)

  # Type checking. Enable once mypy runs clean; fill in deps/stubs below.
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
