# Git hooks that run automatically before each commit.
# Install once with: uv run pre-commit install
# Run manually on everything with: uv run pre-commit run --all-files
repos:
  # Ruff: lint (with autofix) and format. Mirrors the CI checks.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Basic file hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
