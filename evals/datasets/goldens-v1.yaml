# Spec of a good A2 lesson. Not shown to the learner.
# 25 cases covering the highest-risk A2 topics (contrasts, articles, perfect, L1 Russian errors).
- id: g01
  topic_id: present_simple_third_person
  expected_key_points:
    - "В 3-м лице единственного числа (he/she/it) к глаголу в Present Simple добавляется -s/-es."
    - "В вопросах и отрицаниях окончание -s переходит на does: Does he work? He doesn't work."
    - "После does/doesn't основной глагол стоит в первой форме без -s."
  forbidden_claims:
    - "В Past Simple тоже нужно добавлять -s в 3-м лице."
    - "После does глагол сохраняет -s (Does he works)."
    - "-s ставится во всех лицах Present Simple."
  must_show_form: "he/she/it + V-s; does/doesn't + V"
  typical_l1_ru_error:
    incorrect: He go to school every day.
    correct: He goes to school every day.
    why_ru: "В русском глагол не получает отдельного -s в 3-м лице, поэтому окончание часто пропускают."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "третье лицо he/she/it с -s и хотя бы один вопрос или отрицание с does/doesn't"
    avoid_structures:
      - Present Perfect
      - Present Continuous
      - conditionals
    notes: "Лексика A2: school, work, live, watch, go."

- id: g02
  topic_id: present_simple_vs_continuous
  expected_key_points:
    - "Present Simple — привычки, факты, расписания."
    - "Present Continuous — действие в момент речи или временная ситуация."
    - "Сигналы: every day/usually → Simple; now/at the moment → Continuous."
  forbidden_claims:
    - "Present Continuous описывает любую привычку, если она 'интересная'."
    - "Глаголы состояния know, like, want свободно ставятся в Continuous."
    - "Present Simple нельзя использовать про расписание в будущем (The train leaves at 6)."
  must_show_form: "V / V-s vs am/is/are + V-ing"
  typical_l1_ru_error:
    incorrect: I am go to work every day.
    correct: I go to work every day.
    why_ru: "Русское настоящее не различает 'вообще' и 'сейчас', поэтому калькируют Continuous на привычки."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "минимум одна пара контраста Simple vs Continuous на близких ситуациях"
    avoid_structures:
      - Present Perfect
      - mixed conditionals
      - Future Perfect
    notes: "Не уводить урок в stative verbs — для этого отдельная тема."

- id: g03
  topic_id: stative_verbs_a2
  expected_key_points:
    - "Глаголы состояния (know, like, want, have как 'иметь', believe) обычно не ставят в Continuous."
    - "Для них в значении состояния используют Simple: I know, I like this song."
    - "Have в значении действия (have a shower) может быть Continuous."
  forbidden_claims:
    - "Ни один глагол с have никогда не бывает Continuous."
    - "I am knowing — нормальный A2 вариант."
    - "Все глаголы восприятия (see, hear) всегда только Simple, без исключений уровня выше A2."
  must_show_form: "stative: I know/like/want (Simple), не am knowing"
  typical_l1_ru_error:
    incorrect: I am knowing this word.
    correct: I know this word.
    why_ru: "В русском нет запрета Continuous на 'знать/любить', поэтому калькируют I am knowing / I am wanting."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "know/like/want в Simple и при желании один контраст have a shower"
    avoid_structures:
      - Present Perfect Continuous
      - get used to
      - mixed conditionals

- id: g04
  topic_id: past_simple_questions_negatives
  expected_key_points:
    - "Вопрос: Did + подлежащее + первая форма глагола."
    - "Отрицание: didn't + первая форма."
    - "После did/didn't не ставят V-ed и не ставят вторую форму (went, saw)."
  forbidden_claims:
    - "Did you went / Did she saw — допустимо."
    - "В вопросе Past Simple достаточно интонации без did, как в русском."
    - "He didn't went — правильное отрицание."
  must_show_form: "Did + subject + V? / subject + didn't + V"
  typical_l1_ru_error:
    incorrect: Did you went to the cinema?
    correct: Did you go to the cinema?
    why_ru: "В русском прошедшее уже в глаголе, поэтому did дублируют второй формой: Did you went."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "хотя бы один вопрос с Did и одно отрицание с didn't, глагол в первой форме"
    avoid_structures:
      - Present Perfect
      - Past Perfect
      - used to

- id: g05
  topic_id: past_simple_vs_continuous
  expected_key_points:
    - "Past Simple — завершённое действие в прошлом."
    - "Past Continuous — действие в процессе в конкретный момент прошлого."
    - "Частый сюжет A2: длинное действие в Continuous, короткое прерывание в Simple (I was cooking when he arrived)."
  forbidden_claims:
    - "Past Continuous нужен для любой законченной истории вчера."
    - "When I was a child I was living... обязательно вместо I lived."
    - "Past Perfect обязателен в таких предложениях на A2."
  must_show_form: "was/were + V-ing vs V-ed / irregular V2; when + Past Simple"
  typical_l1_ru_error:
    incorrect: I cooked when he was arriving.
    correct: I was cooking when he arrived.
    why_ru: "Путают, какое действие 'фон', какое 'событие'; ставят Continuous на короткий глагол."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "хотя бы одно предложение с when: Continuous + Simple"
    avoid_structures:
      - Past Perfect
      - third conditional
      - Present Perfect Continuous

- id: g06
  topic_id: there_is_are
  expected_key_points:
    - "There is + единственное число; there are + множественное."
    - "Конструкция вводит наличие предмета в месте, не переводится дословно 'там есть' в каждом случае."
    - "Вопрос: Is there / Are there; отрицание: there isn't / there aren't."
  forbidden_claims:
    - "It is a book on the table — нормальный способ сказать 'на столе книга'."
    - "There is всегда только про далёкое 'там', не про 'здесь'."
    - "There are a book — согласование не важно."
  must_show_form: "There is + singular noun / There are + plural noun"
  typical_l1_ru_error:
    incorrect: It is a cat in the kitchen.
    correct: There is a cat in the kitchen.
    why_ru: "Калька с «это/оно есть»: It is a cat in the kitchen вместо there is."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "there is + единственное и there are + множественное"
    avoid_structures:
      - there exists (formal)
      - Present Perfect
      - cleft sentences

- id: g07
  topic_id: articles_a_an
  expected_key_points:
    - "a/an — неопределённый артикль перед исчисляемым в единственном числе."
    - "an перед звуком гласного (an apple, an hour), a перед звуком согласного (a university — звук /j/)."
    - "Правило про звук, не про букву."
  forbidden_claims:
    - "an ставится перед любой буквой a, e, i, o, u независимо от звука (an university)."
    - "a/an можно ставить перед неисчисляемыми (a water, a music) как норму A2."
    - "Артикль a обязателен во множественном числе."
  must_show_form: "a + consonant sound; an + vowel sound"
  typical_l1_ru_error:
    incorrect: I have cat.
    correct: I have a cat.
    why_ru: "В русском нет артиклей, a/an часто выпадают."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "минимум один a и один an, желательно an hour или a university как звук vs буква"
    avoid_structures:
      - generic the with nationalities at C1
      - zero article theory dump
      - proper names with the (all cases)

- id: g08
  topic_id: articles_the_zero
  expected_key_points:
    - "the — когда слушатель понимает, о каком предмете речь (уже упоминали / единственный в контексте)."
    - "Нулевой артикль: множественное и неисчисляемые в общем смысле (I like music; Cats are nice)."
    - "the перед уникальными в быту A2: the sun, the internet, the radio — только если это реально A2-список, без перегруза."
  forbidden_claims:
    - "the ставится перед каждым существительным."
    - "Перед именами людей нужен the (the Anna)."
    - "I like the music всегда верно, даже когда речь про музыку вообще."
  must_show_form: "the + specific noun; zero article + plural/uncountable in general"
  typical_l1_ru_error:
    incorrect: I like the music.
    correct: I like music.
    why_ru: "Либо ставят the везде, либо нигде; для 'вообще' нужен нулевой артикль."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "контраст the (конкретное) vs zero (вообще)"
    avoid_structures:
      - geographical names full table
      - the + adjectives for groups at length
      - Present Perfect

- id: g09
  topic_id: countable_uncountable
  expected_key_points:
    - "Исчисляемые имеют единственное/множественное (a book / books)."
    - "Неисчисляемые не берут a/an и не имеют обычного множественного: water, information, advice, furniture, money."
    - "Для неисчисляемых: some water, a piece of advice, not an advice / informations."
  forbidden_claims:
    - "informations, advices, furnitures, moneys — нормальные множественные."
    - "Все еда неисчисляемая без исключений (an apple vs rice)."
    - "news — множественное, потому что -s."
  must_show_form: "a/an + countable singular; some/much + uncountable (no -s)"
  typical_l1_ru_error:
    incorrect: I need an information.
    correct: I need some information.
    why_ru: "Русские «информация/совет/новости» ведут себя иначе; frequent errors: an advice, informations, a news."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "хотя бы одно неисчисляемое advice/information/news/furniture/money"
    avoid_structures:
      - mixed conditionals
      - article the full geography
      - Present Perfect Continuous

- id: g10
  topic_id: some_any
  expected_key_points:
    - "some — утверждения (I've got some bread)."
    - "any — отрицания и большинство вопросов (I haven't got any milk; Have you got any questions?)."
    - "some в вежливых просьбах и предложениях: Would you like some tea?"
  forbidden_claims:
    - "any никогда не бывает в утверждениях (any в значении 'любой' на A2 можно не открывать как главное правило)."
    - "some всегда только с неисчисляемыми."
    - "Would you like any tea? как единственный вежливый вариант."
  must_show_form: "some in +; any in −/?; some in offers"
  typical_l1_ru_error:
    incorrect: I haven't got some money.
    correct: I haven't got any money.
    why_ru: "some калькируют на все случаи «несколько/немного», в том числе на отрицания."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "утверждение с some, отрицание или вопрос с any"
    avoid_structures:
      - whoever/whatever
      - any as free-choice at B2
      - conditionals

- id: g11
  topic_id: much_many_a_lot_of
  expected_key_points:
    - "many + исчисляемые во множественном; much + неисчисляемые."
    - "a lot of / lots of — и с исчисляемыми, и с неисчисляемыми, особенно в утверждениях."
    - "much/many чаще в вопросах и отрицаниях на A2 (How much, not much)."
  forbidden_claims:
    - "much books / many money — норма."
    - "a lot of нельзя в утверждениях."
    - "lots of — только неформальный сленг, в уроке A2 запрещён как ошибка."
  must_show_form: "many + plural; much + uncountable; a lot of + both"
  typical_l1_ru_error:
    incorrect: I don't have many money.
    correct: I don't have much money.
    why_ru: "many звучит как «много» универсально; money неисчисляемое → much money."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "many с plural, much с uncountable, a lot of хотя бы раз"
    avoid_structures:
      - far too many academic hedges
      - comparatives more much
      - Present Perfect

- id: g12
  topic_id: comparatives
  expected_key_points:
    - "Короткие прилагательные: -er + than (older than)."
    - "Длинные: more + adjective + than (more interesting than)."
    - "Исключения A2: good → better, bad → worse, far → farther/further."
  forbidden_claims:
    - "more better / more bigger — нормальные двойные формы."
    - "Все двусложные всегда только more (A2: happy → happier допустимо)."
    - "than можно заменить then в сравнении."
  must_show_form: "adj-er than / more adj than; better/worse"
  typical_l1_ru_error:
    incorrect: This book is more better than that one.
    correct: This book is better than that one.
    why_ru: "Двойная маркировка: more + already comparative, как «более лучше»."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "один -er than, один more ... than, желательно better или worse"
    avoid_structures:
      - double comparatives the more the more as main topic
      - superlatives as the only examples
      - inversion

- id: g13
  topic_id: too_enough
  expected_key_points:
    - "too + прилагательное = слишком (too small)."
    - "enough после прилагательного (big enough) и перед существительным (enough time)."
    - "too не равно very: very — очень, too — слишком (проблема)."
  forbidden_claims:
    - "enough adjective (enough big) как норма."
    - "too всегда положительная оценка, синоним very."
    - "too much + прилагательное вместо too + adjective (too much small как главное правило)."
  must_show_form: "too + adj; adj + enough; enough + noun"
  typical_l1_ru_error:
    incorrect: This bag is enough big.
    correct: This bag is big enough.
    why_ru: "Порядок как в русском «достаточно большой» → enough big; very и too путают."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "too + adj и adj + enough; по возможности enough + noun"
    avoid_structures:
      - so...that at B1 length
      - such vs so as main topic
      - conditionals

- id: g14
  topic_id: will_vs_going_to
  expected_key_points:
    - "going to — план, намерение, предсказание по очевидным признакам."
    - "will — решение в момент речи, обещание, предложение, чистое предсказание."
    - "На A2 зоны пересекаются; урок учит типичные контексты, не абсолютный запрет."
  forbidden_claims:
    - "will никогда нельзя для плана."
    - "going to нельзя для предсказания."
    - "Present Simple — единственный правильный способ говорить о будущем."
  must_show_form: "am/is/are going to + V vs will + V"
  typical_l1_ru_error:
    incorrect: I will to go to the shop tomorrow. I already have a list.
    correct: I'm going to go to the shop tomorrow. I already have a list.
    why_ru: "will to + V и will на заранее задуманный план; will калькируют с русского «буду»."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "контраст заранее задуманный план (going to) vs решение сейчас (will)"
    avoid_structures:
      - Future Continuous
      - Future Perfect
      - shall as main A2 form

- id: g15
  topic_id: mustnt_dont_have_to
  expected_key_points:
    - "mustn't = запрещено, нельзя."
    - "don't have to = не обязательно, можно не делать."
    - "Это не синонимы; русское «не надо» покрывает оба и путает."
  forbidden_claims:
    - "mustn't и don't have to — одно и то же."
    - "needn't как обязательная форма A2 без пометки, что have to достаточно."
    - "You must to go — норма."
  must_show_form: "mustn't + V vs don't/doesn't have to + V"
  typical_l1_ru_error:
    incorrect: You mustn't pay. It's free.
    correct: You don't have to pay. It's free.
    why_ru: "«Не надо платить» ошибочно переводят mustn't (запрет) вместо don't have to (нет обязанности)."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "одна ситуация запрета (mustn't) и одна «не обязательно» (don't have to)"
    avoid_structures:
      - should have done
      - perfect modals
      - be supposed to as main topic

- id: g16
  topic_id: prepositions_time_in_on_at
  expected_key_points:
    - "at — часы и точки (at 7, at night, at the weekend UK)."
    - "on — дни и даты (on Monday, on 1 May, on Sunday morning)."
    - "in — месяцы, годы, длительные периоды (in July, in 2020, in the morning)."
  forbidden_claims:
    - "in Monday / at July — норма."
    - "on the morning как основной вариант вместо in the morning."
    - "in night вместо at night."
  must_show_form: "at + clock/night; on + day/date; in + month/year/morning"
  typical_l1_ru_error:
    incorrect: I was born on July.
    correct: I was born in July.
    why_ru: "Один русский «в/на» не мапится на in/on/at; дни vs месяцы путают."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "хотя бы по одному примеру at, on и in"
    avoid_structures:
      - during vs for as main topic
      - by vs until as main topic
      - Present Perfect

- id: g17
  topic_id: present_perfect_ever_never
  expected_key_points:
    - "Present Perfect связывает прошлое с настоящим: опыт за жизнь."
    - "ever — в вопросах (Have you ever...?), never — в отрицательном опыте (I have never...)."
    - "Форма have/has + V3; never стоит после have/has."
  forbidden_claims:
    - "Have you ever been there yesterday."
    - "I have never went."
    - "Present Perfect — просто 'ещё одно прошедшее' вместо Past Simple для датированных фактов."
  must_show_form: "Have/Has + subject + (ever) + V3; have/has never + V3"
  typical_l1_ru_error:
    incorrect: I never was in London.
    correct: I have never been to London.
    why_ru: "Русское «никогда не был» калькируют Past Simple; предлог in London вместо been to."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "вопрос с ever и утверждение/отрицание с never; been to при опыте мест"
    avoid_structures:
      - Present Perfect Continuous
      - Past Perfect
      - dated yesterday/ago in the same sentence as ever/never

- id: g18
  topic_id: present_perfect_just_already_yet
  expected_key_points:
    - "just — только что (have just + V3)."
    - "already — уже (обычно утверждение; позиция after have)."
    - "yet — ещё не / уже? в отрицаниях и вопросах (обычно в конце)."
  forbidden_claims:
    - "I have just seen him yesterday."
    - "yet в середине как already без пометки (I have yet seen — не A2-норма)."
    - "already и yet — полные синонимы."
  must_show_form: "have/has just + V3; have/has already + V3; haven't + V3 + yet"
  typical_l1_ru_error:
    incorrect: I have already seen this film yesterday.
    correct: I have already seen this film. / I saw this film yesterday.
    why_ru: "already + конкретное время (yesterday) — смешение Perfect и Past Simple."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "по возможности все три маркера: just, already, yet"
    avoid_structures:
      - still as the only focus (separate topic)
      - Past Perfect
      - dated time expressions with just/already

- id: g19
  topic_id: present_perfect_vs_past_simple
  expected_key_points:
    - "Past Simple — законченное действие в известное время (yesterday, last year, in 2019, when I was a child)."
    - "Present Perfect — результат/опыт без конкретной точки на шкале, связь с сейчас."
    - "yesterday / last week / ago / when + past → Past Simple, не Perfect."
  forbidden_claims:
    - "I have seen him yesterday — допустимо."
    - "Present Perfect и Past Simple всегда взаимозаменяемы."
    - "Если действие в прошлом, всегда нужен Perfect."
  must_show_form: "have/has + V3 (no past time) vs V2 + past time"
  typical_l1_ru_error:
    incorrect: I have seen him yesterday.
    correct: I saw him yesterday.
    why_ru: "Самая частая ошибка: Perfect + yesterday/ago/last year."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "явный контраст: Perfect без даты vs Simple с yesterday/last/ago"
    avoid_structures:
      - Present Perfect Continuous
      - Past Perfect
      - mixed conditionals

- id: g20
  topic_id: been_vs_gone
  expected_key_points:
    - "have been to — ездил и вернулся (опыт)."
    - "have gone to — уехал и его сейчас там нет."
    - "been — форма be; gone — форма go; смысл разный в Present Perfect."
  forbidden_claims:
    - "been и gone всегда синонимы."
    - "She has gone to Paris значит 'она когда-то была в Париже и уже дома'."
    - "I have been to shop без артикля как единственный бытовой пример (to the shop)."
  must_show_form: "have/has been to vs have/has gone to"
  typical_l1_ru_error:
    incorrect: She has gone to London. She is back now and tells us about it.
    correct: She has been to London. She is back now and tells us about it.
    why_ru: "gone понимают как 'ездила', хотя gone = ещё не вернулась."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "контраст been to (вернулся) vs gone to (ещё там)"
    avoid_structures:
      - Past Perfect
      - get used to
      - been as copula only without to + place

- id: g21
  topic_id: for_since_ago
  expected_key_points:
    - "for + длительность (for two years, for a week)."
    - "since + точка старта (since 2020, since Monday, since I arrived)."
    - "ago + Past Simple (two years ago), не Present Perfect."
  forbidden_claims:
    - "I have lived here two years ago."
    - "since two years как норма вместо for two years."
    - "for 2019 вместо in/since 2019."
  must_show_form: "Present Perfect + for/since; Past Simple + ago"
  typical_l1_ru_error:
    incorrect: I live here since two years.
    correct: I have lived here for two years.
    why_ru: "Калька «живу здесь уже два года»: Simple + since + длительность вместо Perfect + for."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "for, since и ago — все три хотя бы по разу"
    avoid_structures:
      - Present Perfect Continuous as required form
      - during vs for as main topic
      - by the time

- id: g22
  topic_id: first_conditional
  expected_key_points:
    - "If + Present Simple, will + V — реальное/возможное в будущем."
    - "В if-части не ставят will (If it rains, not If it will rain)."
    - "Порядок частей можно менять; запятая если if-часть первая."
  forbidden_claims:
    - "If I will see him, I will tell him — норма A2."
    - "First conditional = always / scientific facts (это zero conditional, другая тема)."
    - "If I would... как first conditional."
  must_show_form: "If + Present Simple, will + V"
  typical_l1_ru_error:
    incorrect: If it will rain, we will stay at home.
    correct: If it rains, we will stay at home.
    why_ru: "В русском в обеих частях будущее; в английском в if — настоящее."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "If + Present Simple, will + V; желательно один обратный порядок"
    avoid_structures:
      - second/third conditional
      - mixed conditionals
      - unless as the only conjunction unless briefly

- id: g23
  topic_id: when_clauses_present
  expected_key_points:
    - "В придаточных времени (when, after, before, as soon as) для будущего используют Present Simple, не will."
    - "В главной части — will: I'll call you when I arrive."
    - "when здесь не вопрос, а союз времени."
  forbidden_claims:
    - "When I will arrive, I will call you — норма."
    - "Это то же самое, что Present Continuous for future arrangements."
    - "when-придаточное всегда Past Simple."
  must_show_form: "will + V + when/after/before + Present Simple"
  typical_l1_ru_error:
    incorrect: I will call you when I will arrive.
    correct: I will call you when I arrive.
    why_ru: "Как и в if, русское будущее в обеих частях переносят в when-придаточное."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "when/after/before + Present Simple и will в главной"
    avoid_structures:
      - conditionals second/third
      - Future Perfect
      - as soon as with Present Perfect as required A2 form

- id: g24
  topic_id: verb_ing_like_love_hate
  expected_key_points:
    - "После like / love / hate / enjoy на A2 типично -ing: I like swimming."
    - "Речь о деятельности как о занятии, не о цели."
    - "like + to-infinitive тоже бывает; на A2 можно сказать, что -ing — самый частый и безопасный выбор, не запрещая to."
  forbidden_claims:
    - "I like swim / I like to swimming."
    - "После like всегда только to-infinitive, -ing ошибка."
    - "hate never takes -ing."
  must_show_form: "like/love/hate/enjoy + V-ing"
  typical_l1_ru_error:
    incorrect: I like swim.
    correct: I like swimming.
    why_ru: "После «люблю» ставят голый инфинитив без to и без -ing."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "like/love/hate + V-ing; разные глаголы, не один и тот же swim"
    avoid_structures:
      - stop doing vs stop to do as main B1 contrast
      - used to vs be used to
      - gerund as subject theory dump

- id: g25
  topic_id: present_passive
  expected_key_points:
    - "Present Simple passive: am/is/are + V3."
    - "Используем, когда важнее объект/результат, а не кто делает (The room is cleaned every day)."
    - "by + агент на A2 необязателен; добавлять, только если агент важен."
  forbidden_claims:
    - "The room is clean every day как passive (clean vs cleaned)."
    - "Passive = любой глагол be + V-ing."
    - "В passive сохраняем do/does: The room does cleaned."
  must_show_form: "am/is/are + V3"
  typical_l1_ru_error:
    incorrect: The house is build in 2010. / The house built every year.
    correct: The house is built of wood. / The house is painted every year.
    why_ru: "Путают V3 и первую форму; опускают be; дату 2010 тянут в present passive (нужен past passive)."
  example_constraints:
    min_examples: 4
    max_examples: 8
    must_include_construction: "am/is/are + V3 в настоящем, без dated past (in 2010)"
    avoid_structures:
      - Past Perfect passive
      - get-passive as required
      - present continuous passive as required A2 form
    notes: "Не ставить in 2010 в present passive — это past."
